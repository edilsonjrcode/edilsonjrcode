<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Linha do tempo da formação: 2022 início do Tecnólogo em Sistemas para Internet; 2024 conclusão do Tecnólogo e início do MBA em Fullstack Web Development; 2025 conclusão do MBA. Ambos pela UNIESP.">
<style>
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 9s cubic-bezier(.65,0,.35,1) infinite}
@keyframes draw{0%{stroke-dashoffset:1000}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.pt{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop 9s ease infinite}
.p1{animation-delay:.2s}.p2{animation-delay:1.4s}.p3{animation-delay:2.4s}
@keyframes pop{0%{opacity:0;transform:scale(0)}6%{opacity:1;transform:scale(1.25)}10%,85%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1)}}
.lb{opacity:0;animation:show 9s ease infinite}
.l1{animation-delay:.5s}.l2{animation-delay:1.7s}.l3{animation-delay:2.7s}
@keyframes show{0%{opacity:0;transform:translateY(10px)}8%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.line,.pt,.lb,.ring{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FAFAF7" stroke-opacity="0.05"/></pattern>
<clipPath id="r"><rect width="1280" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#r)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1280" height="300" fill="#111318"/>
<rect width="1280" height="300" fill="url(#g)"/>
<line x1="160" y1="150" x2="1120" y2="150" stroke="#FAFAF7" stroke-opacity="0.12" stroke-width="2"/>
<path class="line" d="M160 150H1120" stroke="#2B4BFF" stroke-width="4" stroke-linecap="round" pathLength="1000"/>

<circle class="pt p1" cx="160" cy="150" r="11" fill="#FAFAF7" stroke="#2B4BFF" stroke-width="5"/>
<circle class="pt p2" cx="760" cy="150" r="11" fill="#FAFAF7" stroke="#2B4BFF" stroke-width="5"/>
<circle class="ring" cx="1120" cy="150" r="14" fill="none" stroke="#6F87FF" stroke-width="2"/>
<circle class="pt p3" cx="1120" cy="150" r="14" fill="#2B4BFF" stroke="#DCE3FF" stroke-width="4"/>

<g class="lb l1">
<text x="160" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#FAFAF7">2022</text>
<text x="160" y="200" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">Início em Sistemas</text>
<text x="160" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">para Internet</text>
<text x="160" y="250" text-anchor="middle" font-size="14" fill="#9DAEFF">UNIESP</text>
</g>
<g class="lb l2">
<text x="760" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#FAFAF7">2024</text>
<text x="760" y="200" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">Tecnólogo concluído</text>
<text x="760" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">+ início do MBA Full Stack</text>
<text x="760" y="250" text-anchor="middle" font-size="14" fill="#9DAEFF">UNIESP</text>
</g>
<g class="lb l3">
<text x="1120" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#FAFAF7">2025</text>
<text x="1120" y="200" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">MBA em Fullstack</text>
<text x="1120" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#FAFAF7">Web Development</text>
<text x="1120" y="250" text-anchor="middle" font-size="14" fill="#9DAEFF">UNIESP · Pós-graduação</text>
</g>
</g>
</svg>
